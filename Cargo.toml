[package]
name = "endfield-direct-launcher"
version = "0.1.2"
edition = "2021"
description = "Start Endfield.exe directly, bypassing the Hypergryph launcher UI"
license = "MIT"

[[bin]]
name = "EndfieldDirectLauncher"
path = "src/main.rs"

# No dependencies: everything is raw Win32 FFI.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
